<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>死亡搁浅2 · 主机质检 (云存储)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
  <style>
    /* ... 所有CSS样式保持不变 ... */
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500&display=swap');

    :root {
      --bg: #0d0f14;
      --surface: #141720;
      --surface2: #1c2030;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --accent: #e8a020;
      --accent-dim: rgba(232,160,32,0.12);
      --accent-text: #f5c060;
      --green: #2ec98e;
      --green-dim: rgba(46,201,142,0.12);
      --text: #e8eaf0;
      --text2: #7a8299;
      --text3: #4a5168;
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Noto Sans SC', system-ui, sans-serif;
      --r: 6px;
      --r2: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      padding-bottom: 120px;
    }

    .config-bar {
      background: #1a1a2e;
      border-bottom: 1px solid var(--border2);
      padding: 8px 12px;
      font-size: 11px;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .config-bar .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text3);
    }
    .config-bar .status-dot.online { background: var(--green); }
    .config-bar .status-dot.offline { background: #e24b4a; }
    .config-bar .status-dot.syncing { background: var(--accent); animation: pulse 0.8s ease-in-out infinite; }

    .hdr {
      padding: 16px 16px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .hdr-left { display: flex; flex-direction: column; gap: 4px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
      color: var(--accent); text-transform: uppercase;
    }
    .eyebrow::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .hdr-title {
      font-family: var(--mono); font-size: 20px; font-weight: 400;
      color: var(--text); letter-spacing: .5px;
    }
    .hdr-sub { font-size: 12px; color: var(--text2); }

    .date-chip {
      position: relative; display: flex; align-items: center; gap: 6px;
      background: var(--surface2); border: 0.5px solid var(--border2);
      border-radius: var(--r); padding: 8px 12px; cursor: pointer;
      font-family: var(--mono); font-size: 13px; color: var(--accent-text);
      white-space: nowrap; flex-shrink: 0;
    }
    .date-chip input[type=date] {
      position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
    }

    .stats {
      display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 8px; padding: 16px 16px 0;
    }
    .stat {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r2); padding: 12px 8px; text-align: center;
    }
    .stat-n { font-family: var(--mono); font-size: 26px; color: var(--text); line-height: 1; }
    .stat-n.hi { color: var(--green); }
    .stat-l { font-size: 11px; color: var(--text2); margin-top: 4px; }

    .tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      margin: 16px 16px 0;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r2); padding: 3px; gap: 3px;
    }
    .tab {
      padding: 9px 0; font-size: 13px; font-family: var(--sans);
      font-weight: 400; color: var(--text2);
      background: none; border: none; border-radius: calc(var(--r2) - 2px);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 6px; transition: all .2s; letter-spacing: .3px;
    }
    .tab.active {
      background: var(--surface2); color: var(--text);
      border: 0.5px solid var(--border2);
    }
    .tab i { font-size: 15px; }

    .panel { display: none; padding: 12px 16px 20px; }
    .panel.on { display: block; }

    .host-grid { display: flex; flex-direction: column; gap: 6px; }
    .host-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r2); overflow: hidden;
      transition: border-color .15s;
    }
    .host-card.checked { border-color: rgba(46,201,142,0.35); }
    .host-top {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px;
      cursor: pointer; user-select: none;
    }
    .host-id {
      font-family: var(--mono); font-size: 13px; color: var(--text2);
      width: 44px; flex-shrink: 0;
    }
    .host-card.checked .host-id { color: var(--green); }
    .toggle-track {
      width: 44px; height: 26px; border-radius: 13px; flex-shrink: 0;
      background: var(--surface2); border: 1px solid var(--border2);
      position: relative; transition: background .2s, border-color .2s;
    }
    .host-card.checked .toggle-track {
      background: rgba(46,201,142,0.2); border-color: var(--green);
    }
    .toggle-knob {
      position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--text3); transition: transform .2s, background .2s;
    }
    .host-card.checked .toggle-knob {
      transform: translateX(18px); background: var(--green);
    }
    .toggle-label {
      font-size: 12px; color: var(--text3); flex: 1;
      transition: color .15s;
    }
    .host-card.checked .toggle-label { color: var(--green); }
    .host-bottom { padding: 0 14px 11px; }
    .remark-in {
      width: 100%; background: var(--surface2);
      border: 0.5px solid var(--border); border-radius: var(--r);
      padding: 7px 10px; font-size: 12px; color: var(--text);
      font-family: var(--sans); outline: none;
      transition: border-color .15s;
    }
    .remark-in::placeholder { color: var(--text3); }
    .remark-in:focus { border-color: var(--border2); }

    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px 20px;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      display: flex; gap: 8px; z-index: 10;
    }
    .save-btn {
      flex: 1; padding: 13px;
      background: var(--accent); color: #0d0f14;
      border: none; border-radius: var(--r2);
      font-size: 14px; font-weight: 500; font-family: var(--sans);
      letter-spacing: .5px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .15s;
    }
    .save-btn:active { opacity: .8; }
    .save-btn:disabled { opacity: .35; cursor: not-allowed; }
    .save-btn i { font-size: 16px; }
    
    .sync-btn {
      padding: 13px 16px;
      background: var(--surface2); color: var(--accent-text);
      border: 0.5px solid var(--border2); border-radius: var(--r2);
      font-size: 14px; cursor: pointer; transition: opacity .15s;
      white-space: nowrap; display: flex; align-items: center; gap: 6px;
    }
    .sync-btn:active { opacity: .8; }

    .hist-top {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px; margin-top: 16px;
    }
    .hist-sel {
      flex: 1; background: var(--surface); border: 0.5px solid var(--border2);
      color: var(--text); border-radius: var(--r); padding: 9px 12px;
      font-size: 13px; font-family: var(--sans); outline: none;
    }
    .hist-meta {
      display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .pill {
      font-family: var(--mono); font-size: 11px; padding: 3px 9px;
      border-radius: 4px; letter-spacing: .3px;
    }
    .pill.green { background: var(--green-dim); color: var(--green); }
    .pill.amber { background: var(--accent-dim); color: var(--accent-text); }

    .h-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r2); overflow: hidden; margin-bottom: 6px;
    }
    .h-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-bottom: 0.5px solid var(--border);
    }
    .h-row:last-child { border-bottom: none; }
    .h-id { font-family: var(--mono); font-size: 13px; color: var(--text2); width: 44px; flex-shrink: 0; }
    .h-row.passed .h-id { color: var(--green); }
    .h-status { flex-shrink: 0; }
    .pass-badge {
      display: inline-flex; align-items: center; gap: 3px;
      background: var(--green-dim); color: var(--green);
      font-size: 11px; padding: 2px 8px; border-radius: 3px;
      font-family: var(--mono); letter-spacing: .3px;
    }
    .fail-dash { color: var(--text3); font-size: 13px; }
    .h-rem { font-size: 12px; color: var(--text2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty-state {
      text-align: center; padding: 3rem 0; color: var(--text3); font-size: 13px;
    }
    .empty-state i { font-size: 32px; display: block; margin-bottom: 10px; color: var(--text3); }

    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: var(--green); color: #0d0f14;
      font-size: 13px; font-weight: 500; padding: 9px 20px;
      border-radius: var(--r2); opacity: 0; pointer-events: none;
      transition: opacity .3s; white-space: nowrap; z-index: 99;
    }
    .toast.show { opacity: 1; }

    .section-label {
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
      color: var(--text3); text-transform: uppercase; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 0.5px; background: var(--border);
    }

    .add-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 0.5px dashed var(--border2);
      border-radius: var(--r2); padding: 10px 14px; margin-top: 6px;
    }
    .add-input {
      flex: 1; background: transparent; border: none; outline: none;
      font-family: var(--mono); font-size: 13px; color: var(--text);
      text-transform: uppercase; letter-spacing: .5px; min-width: 0;
    }
    .add-input::placeholder { color: var(--text3); font-family: var(--mono); text-transform: none; letter-spacing: 0; }
    .add-confirm {
      background: var(--accent-dim); border: 0.5px solid rgba(232,160,32,0.3);
      color: var(--accent-text); border-radius: var(--r);
      padding: 5px 12px; font-size: 12px; font-family: var(--sans);
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: background .15s; white-space: nowrap; flex-shrink: 0;
    }
    .add-confirm:active { background: rgba(232,160,32,0.25); }
    .add-confirm i { font-size: 13px; }

    .del-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text3); padding: 4px; border-radius: 4px;
      display: flex; align-items: center; transition: color .15s;
      flex-shrink: 0; margin-left: auto;
    }
    .del-btn:hover { color: #e24b4a; }
    .del-btn i { font-size: 15px; pointer-events: none; }
  </style>
</head>
<body>

<div class="config-bar" id="config-bar">
  <span class="status-dot" id="sync-dot"></span>
  <span id="sync-status">初始化中...</span>
  <span style="margin-left:auto;font-size:10px;" id="sync-time"></span>
</div>

<div class="hdr">
  <div class="hdr-left">
    <span class="eyebrow">死亡搁浅 2 · QC SYSTEM</span>
    <div class="hdr-title">主机质检记录</div>
    <div class="hdr-sub" id="hdr-sub">共 20 台主机 · 云端同步</div>
  </div>
  <div class="date-chip" onclick="document.getElementById('dpick').focus()">
    <i class="ti ti-calendar" style="font-size:14px"></i>
    <span id="d-disp">—</span>
    <input type="date" id="dpick" onchange="onDateChange()">
  </div>
</div>

<div class="stats" id="stats-bar">
  <div class="stat">
    <div class="stat-n" id="s-total">20</div>
    <div class="stat-l">主机总数</div>
  </div>
  <div class="stat">
    <div class="stat-n hi" id="s-pass">0</div>
    <div class="stat-l">已通过</div>
  </div>
  <div class="stat">
    <div class="stat-n" id="s-pct">0%</div>
    <div class="stat-l">通过率</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-u" onclick="switchTab('u')">
    <i class="ti ti-pencil"></i>今日更新
  </button>
  <button class="tab" id="tab-h" onclick="switchTab('h')">
    <i class="ti ti-clock-hour-4"></i>历史记录
  </button>
</div>

<div class="panel on" id="panel-u">
  <div class="section-label" style="margin-top:8px">通道状态</div>
  <div class="host-grid" id="host-grid"></div>
  <div class="add-row">
    <i class="ti ti-plus" style="font-size:15px;color:var(--text3);flex-shrink:0"></i>
    <input class="add-input" id="add-input" placeholder="输入主机编号，如 GZ021" maxlength="20"
           onkeydown="if(event.key==='Enter')addHost()">
    <button class="add-confirm" onclick="addHost()">
      <i class="ti ti-check"></i>添加
    </button>
  </div>
</div>

<div class="panel" id="panel-h">
  <div class="hist-top">
    <select class="hist-sel" id="hist-sel" onchange="loadHist()">
      <option value="">— 选择历史日期 —</option>
    </select>
  </div>
  <div id="hist-meta" class="hist-meta" style="display:none"></div>
  <div id="hist-body">
    <div class="empty-state">
      <i class="ti ti-archive"></i>选择日期查看历史记录
    </div>
  </div>
</div>

<div class="save-bar" id="save-bar">
  <button class="save-btn" id="save-btn" onclick="saveAndSync()">
    <i class="ti ti-cloud-up"></i>保存并同步
  </button>
  <button class="sync-btn" onclick="forceSync()">
    <i class="ti ti-refresh"></i> 强制同步
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 配置区域 ====================
const GITHUB_TOKEN = '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';
const GIST_ID = '7f5932c27738dfa4d93bee403bc32d09';
// =================================================

const API_URL = `https://api.github.com/gists/${GIST_ID}`;
const DEFAULT_HOSTS = Array.from({length:20},(_,i)=>'GZ'+String(i+1).padStart(3,'0'));

let HOSTS = [...DEFAULT_HOSTS];
let records = {};
let todayStatus = {};
let currentDate = '';
let isSaving = false;

// ==================== GitHub API 操作 ====================
async function fetchFromGist() {
  try {
    updateSyncStatus('syncing');
    const response = await fetch(API_URL, {
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    
    if (!response.ok) throw new Error('获取失败');
    
    const gist = await response.json();
    const file = gist.files['ds2_qc_data.json'];
    
    if (!file || !file.content) {
      await createDefaultGistFile();
      return;
    }
    
    const data = JSON.parse(file.content);
    
    if (data.hosts && Array.isArray(data.hosts)) {
      HOSTS = data.hosts;
    }
    if (data.records && typeof data.records === 'object') {
      records = data.records;
    }
    
    if (records[currentDate] && records[currentDate].hosts) {
      todayStatus = JSON.parse(JSON.stringify(records[currentDate].hosts));
    } else {
      todayStatus = {};
    }
    
    updateSyncStatus('online');
    buildHostGrid();
    updateStats();
    updateHistorySelect();
    console.log('✅ 数据已从云端加载');
    return true;
  } catch (error) {
    console.error('同步失败:', error);
    updateSyncStatus('offline');
    loadFromLocalStorage();
    return false;
  }
}

async function uploadToGist(data) {
  if (isSaving) return;
  isSaving = true;
  
  try {
    updateSyncStatus('syncing');
    const response = await fetch(API_URL, {
      method: 'PATCH',
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        files: {
          'ds2_qc_data.json': {
            content: JSON.stringify(data, null, 2)
          }
        }
      })
    });
    
    if (!response.ok) {
      const errorData = await response.json();
      console.error('上传失败详情:', errorData);
      throw new Error('上传失败: ' + response.status);
    }
    
    updateSyncStatus('online');
    saveToLocalStorage(data);
    document.getElementById('sync-time').textContent = new Date().toLocaleTimeString();
    console.log('✅ 数据已保存到云端');
    return true;
  } catch (error) {
    console.error('上传失败:', error);
    updateSyncStatus('offline');
    saveToLocalStorage(data);
    return false;
  } finally {
    isSaving = false;
  }
}

async function createDefaultGistFile() {
  const defaultData = {
    hosts: HOSTS,
    records: records,
    version: '3.0'
  };
  
  try {
    await uploadToGist(defaultData);
    console.log('已创建云端数据文件');
  } catch (error) {
    console.error('创建默认文件失败:', error);
  }
}

// ==================== 本地存储备份 ====================
function saveToLocalStorage(data) {
  try {
    localStorage.setItem('ds2_qc_hosts', JSON.stringify(data.hosts));
    localStorage.setItem('ds2_qc_records', JSON.stringify(data.records));
  } catch (e) {
    console.warn('本地存储失败:', e);
  }
}

function loadFromLocalStorage() {
  try {
    const hostsStr = localStorage.getItem('ds2_qc_hosts');
    const recordsStr = localStorage.getItem('ds2_qc_records');
    
    if (hostsStr) {
      const parsed = JSON.parse(hostsStr);
      if (Array.isArray(parsed) && parsed.length > 0) {
        HOSTS = parsed;
      }
    }
    if (recordsStr) {
      records = JSON.parse(recordsStr);
    }
    
    if (records[currentDate] && records[currentDate].hosts) {
      todayStatus = JSON.parse(JSON.stringify(records[currentDate].hosts));
    } else {
      todayStatus = {};
    }
    
    buildHostGrid();
    updateStats();
    updateHistorySelect();
    console.log('📱 已加载本地缓存');
  } catch (e) {
    console.warn('本地加载失败:', e);
  }
}

// ==================== 同步状态更新 ====================
function updateSyncStatus(status) {
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-status');
  
  dot.className = 'status-dot';
  
  switch(status) {
    case 'online':
      dot.classList.add('online');
      text.textContent = '云端已连接';
      break;
    case 'offline':
      dot.classList.add('offline');
      text.textContent = '离线模式';
      break;
    case 'syncing':
      dot.classList.add('syncing');
      text.textContent = '同步中...';
      break;
  }
}

// ==================== 获取当前完整数据 ====================
function getCurrentData() {
  if (!records[currentDate]) {
    records[currentDate] = { hosts: {}, hostOrder: [] };
  }
  records[currentDate].hosts = JSON.parse(JSON.stringify(todayStatus));
  records[currentDate].hostOrder = [...HOSTS];
  
  return {
    hosts: HOSTS,
    records: records,
    version: '3.0',
    lastModified: new Date().toISOString()
  };
}

// ==================== 立即保存函数 ====================
async function immediateSave() {
  const data = getCurrentData();
  await uploadToGist(data);
}

// ==================== UI 函数 ====================
function safeId(h) { return h.replace(/[^a-zA-Z0-9_-]/g,'_'); }

function buildHostGrid() {
  const grid = document.getElementById('host-grid');
  if (!grid) return;
  
  grid.innerHTML = '';
  HOSTS.forEach(host => {
    const d = todayStatus[host] || {};
    const on = !!d.checked;
    const rem = d.remark || '';
    const sid = safeId(host);
    
    const card = document.createElement('div');
    card.className = 'host-card' + (on ? ' checked' : '');
    card.id = 'card-' + sid;
    card.innerHTML = `
      <div class="host-top" onclick="toggleHost('${host}','${sid}')">
        <span class="host-id">${host}</span>
        <div class="toggle-track"><div class="toggle-knob"></div></div>
        <span class="toggle-label">${on ? '通道已通过' : '待检测'}</span>
        <i class="ti ${on ? 'ti-check' : 'ti-minus'}" style="font-size:15px;color:${on ? 'var(--green)' : 'var(--text3)'};flex-shrink:0"></i>
        <button class="del-btn" onclick="deleteHost(event,'${host}')" aria-label="删除 ${host}">
          <i class="ti ti-trash"></i>
        </button>
      </div>
      <div class="host-bottom">
        <input class="remark-in" id="rm-${sid}" placeholder="质检备注（选填）" value="${rem.replace(/"/g,'&quot;')}" oninput="updateRemark('${host}','${sid}')">
      </div>`;
    grid.appendChild(card);
  });
  
  document.getElementById('hdr-sub').textContent = `共 ${HOSTS.length} 台主机 · 云端同步`;
}

function updateStats() {
  const total = HOSTS.length;
  const passed = HOSTS.filter(h => todayStatus[h] && todayStatus[h].checked).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-pass').textContent = passed;
  document.getElementById('s-pct').textContent = (total > 0 ? Math.round(passed/total*100) : 0) + '%';
}

async function toggleHost(host, sid) {
  if(!todayStatus[host]) todayStatus[host] = { checked: false, remark: '' };
  todayStatus[host].checked = !todayStatus[host].checked;
  
  const card = document.getElementById('card-' + sid);
  if (card) {
    const on = todayStatus[host].checked;
    card.classList.toggle('checked', on);
    card.querySelector('.toggle-label').textContent = on ? '通道已通过' : '待检测';
    const ico = card.querySelector('.host-top i.ti');
    ico.className = 'ti ' + (on ? 'ti-check' : 'ti-minus');
    ico.style.color = on ? 'var(--green)' : 'var(--text3)';
  }
  
  updateStats();
  // 立即保存到云端
  await immediateSave();
  toast('✅ 已保存到云端');
}

async function updateRemark(host, sid) {
  if(!todayStatus[host]) todayStatus[host] = { checked: false, remark: '' };
  todayStatus[host].remark = document.getElementById('rm-'+sid).value;
  // 立即保存到云端
  await immediateSave();
}

async function deleteHost(event, host) {
  event.stopPropagation();
  const idx = HOSTS.indexOf(host);
  if(idx === -1) return;
  
  HOSTS.splice(idx, 1);
  delete todayStatus[host];
  
  buildHostGrid();
  updateStats();
  await immediateSave();
  toast(`已移除 ${host} ✅`);
}

async function addHost() {
  const inp = document.getElementById('add-input');
  const val = inp.value.trim().toUpperCase();
  if(!val) { inp.focus(); return; }
  if(HOSTS.includes(val)) { toast('该编号已存在'); inp.select(); return; }
  
  HOSTS.push(val);
  inp.value = '';
  buildHostGrid();
  updateStats();
  
  await immediateSave();
  toast(`已添加 ${val} ✅`);
  
  setTimeout(() => {
    const card = document.getElementById('card-' + safeId(val));
    if(card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function onDateChange() {
  currentDate = document.getElementById('dpick').value;
  const [y,m,d] = currentDate.split('-');
  document.getElementById('d-disp').textContent = `${m}/${d}`;
  
  if (records[currentDate] && records[currentDate].hosts) {
    todayStatus = JSON.parse(JSON.stringify(records[currentDate].hosts));
  } else {
    todayStatus = {};
  }
  
  buildHostGrid();
  updateStats();
}

function updateHistorySelect() {
  const sel = document.getElementById('hist-sel');
  const prev = sel.value;
  const dates = Object.keys(records).sort((a,b) => b.localeCompare(a));
  
  sel.innerHTML = '<option value="">— 选择历史日期 —</option>';
  dates.forEach(d => {
    const o = document.createElement('option');
    o.value = d;
    const [y,m,dd] = d.split('-');
    o.textContent = `${y}年${m}月${dd}日`;
    sel.appendChild(o);
  });
  
  if(prev && records[prev]) sel.value = prev;
}

function loadHist() {
  const d = document.getElementById('hist-sel').value;
  const body = document.getElementById('hist-body');
  const meta = document.getElementById('hist-meta');
  
  if(!d || !records[d]) {
    body.innerHTML = '<div class="empty-state"><i class="ti ti-archive"></i>选择日期查看历史记录</div>';
    meta.style.display = 'none';
    return;
  }
  
  const rec = records[d];
  const hostList = rec.hostOrder || Object.keys(rec.hosts);
  const passed = hostList.filter(h => rec.hosts[h] && rec.hosts[h].checked).length;
  
  meta.style.display = 'flex';
  meta.innerHTML = `<span class="pill amber">死亡搁浅2</span><span class="pill green">通过 ${passed} / ${hostList.length} · ${hostList.length>0?Math.round(passed/hostList.length*100):0}%</span>`;
  
  const card = document.createElement('div');
  card.className = 'h-card';
  card.innerHTML = hostList.map(h => {
    const hd = rec.hosts[h] || {};
    const passed = !!hd.checked;
    return `<div class="h-row${passed ? ' passed' : ''}">
      <span class="h-id">${h}</span>
      <span class="h-status">${passed ? '<span class="pass-badge"><i class="ti ti-check" style="font-size:10px"></i> 通过</span>' : '<span class="fail-dash">—</span>'}</span>
      ${hd.remark ? `<span class="h-rem">${hd.remark}</span>` : ''}
    </div>`;
  }).join('');
  
  body.innerHTML = '';
  body.appendChild(card);
}

function switchTab(t) {
  document.getElementById('tab-u').classList.toggle('active', t==='u');
  document.getElementById('tab-h').classList.toggle('active', t==='h');
  document.getElementById('panel-u').classList.toggle('on', t==='u');
  document.getElementById('panel-h').classList.toggle('on', t==='h');
  document.getElementById('save-bar').style.display = t==='u' ? 'flex' : 'none';
  if(t==='h') loadHist();
}

async function saveAndSync() {
  if (!currentDate) {
    toast('请先选择日期');
    return;
  }
  
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  
  if (!records[currentDate]) {
    records[currentDate] = { hosts: {}, hostOrder: [] };
  }
  records[currentDate].hosts = JSON.parse(JSON.stringify(todayStatus));
  records[currentDate].hostOrder = [...HOSTS];
  
  await immediateSave();
  updateHistorySelect();
  btn.disabled = false;
}

async function forceSync() {
  await fetchFromGist();
  toast('✅ 已从云端同步');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// 暴露函数到全局作用域
window.toggleHost = toggleHost;
window.updateRemark = updateRemark;
window.deleteHost = deleteHost;
window.addHost = addHost;
window.switchTab = switchTab;
window.saveAndSync = saveAndSync;
window.forceSync = forceSync;

// ==================== 初始化 ====================
async function init() {
  const now = new Date();
  currentDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('dpick').value = currentDate;
  const [y,m,d] = currentDate.split('-');
  document.getElementById('d-disp').textContent = `${m}/${d}`;
  
  const online = await fetchFromGist();
  
  if (!online) {
    loadFromLocalStorage();
  }
  
  buildHostGrid();
  updateStats();
  updateHistorySelect();
  
  console.log('🚀 系统已启动，Token:', GITHUB_TOKEN.substring(0, 8) + '...');
  console.log('Gist ID:', GIST_ID);
}

init();
</script>
