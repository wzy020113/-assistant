<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>死亡搁浅2 · 质检</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500&display=swap');

    :root {
      --bg: #0d0f14;
      --surface: #141720;
      --surface2: #1c2030;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --accent: #e8a020;
      --accent-dim: rgba(232,160,32,0.12);
      --accent-text: #f5c060;
      --green: #2ec98e;
      --green-dim: rgba(46,201,142,0.12);
      --text: #e8eaf0;
      --text2: #7a8299;
      --text3: #4a5168;
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Noto Sans SC', system-ui, sans-serif;
      --r: 6px;
      --r2: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      padding-bottom: 120px;
    }

    .status-bar {
      background: #1a1a2e;
      border-bottom: 1px solid var(--border2);
      padding: 8px 12px;
      font-size: 11px;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
    .dot.online { background: var(--green); }
    .dot.offline { background: #e24b4a; }

    .hdr {
      padding: 16px 16px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .hdr-left { display: flex; flex-direction: column; gap: 4px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
      color: var(--accent); text-transform: uppercase;
    }
    .eyebrow::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .hdr-title {
      font-family: var(--mono); font-size: 20px; font-weight: 400;
      color: var(--text); letter-spacing: .5px;
    }
    .hdr-sub { font-size: 12px; color: var(--text2); }

    .date-chip {
      position: relative; display: flex; align-items: center; gap: 6px;
      background: var(--surface2); border: 0.5px solid var(--border2);
      border-radius: var(--r); padding: 8px 12px; cursor: pointer;
      font-family: var(--mono); font-size: 13px; color: var(--accent-text);
      white-space: nowrap; flex-shrink: 0;
    }
    .date-chip input[type=date] {
      position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
    }

    .stats {
      display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 8px; padding: 16px 16px 0;
    }
    .stat {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r2); padding: 12px 8px; text-align: center;
    }
    .stat-n { font-family: var(--mono); font-size: 26px; color: var(--text); line-height: 1; }
    .stat-n.hi { color: var(--green); }
    .stat-l { font-size: 11px; color: var(--text2); margin-top: 4px; }

    .tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      margin: 16px 16px 0;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r2); padding: 3px; gap: 3px;
    }
    .tab {
      padding: 9px 0; font-size: 13px; font-family: var(--sans);
      font-weight: 400; color: var(--text2);
      background: none; border: none; border-radius: calc(var(--r2) - 2px);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 6px; transition: all .2s; letter-spacing: .3px;
    }
    .tab.active {
      background: var(--surface2); color: var(--text);
      border: 0.5px solid var(--border2);
    }
    .tab i { font-size: 15px; }

    .panel { display: none; padding: 12px 16px 20px; }
    .panel.on { display: block; }

    .host-grid { display: flex; flex-direction: column; gap: 6px; }
    .host-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r2); overflow: hidden;
      transition: border-color .15s;
    }
    .host-card.checked { border-color: rgba(46,201,142,0.35); }
    .host-top {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px;
      cursor: pointer; user-select: none;
    }
    .host-id {
      font-family: var(--mono); font-size: 13px; color: var(--text2);
      width: 44px; flex-shrink: 0;
    }
    .host-card.checked .host-id { color: var(--green); }
    .toggle-track {
      width: 44px; height: 26px; border-radius: 13px; flex-shrink: 0;
      background: var(--surface2); border: 1px solid var(--border2);
      position: relative; transition: background .2s, border-color .2s;
    }
    .host-card.checked .toggle-track {
      background: rgba(46,201,142,0.2); border-color: var(--green);
    }
    .toggle-knob {
      position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--text3); transition: transform .2s, background .2s;
    }
    .host-card.checked .toggle-knob {
      transform: translateX(18px); background: var(--green);
    }
    .toggle-label {
      font-size: 12px; color: var(--text3); flex: 1;
      transition: color .15s;
    }
    .host-card.checked .toggle-label { color: var(--green); }
    .host-bottom { padding: 0 14px 11px; }
    .remark-in {
      width: 100%; background: var(--surface2);
      border: 0.5px solid var(--border); border-radius: var(--r);
      padding: 7px 10px; font-size: 12px; color: var(--text);
      font-family: var(--sans); outline: none;
      transition: border-color .15s;
    }
    .remark-in::placeholder { color: var(--text3); }
    .remark-in:focus { border-color: var(--border2); }

    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px 20px;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      display: flex; gap: 8px; z-index: 10;
    }
    .btn {
      padding: 13px 16px; border: none; border-radius: var(--r2);
      font-size: 14px; font-weight: 500; font-family: var(--sans);
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; transition: opacity .15s;
    }
    .btn:active { opacity: .8; }
    .btn-primary { flex: 1; background: var(--accent); color: #0d0f14; }
    .btn-secondary { background: var(--surface2); color: var(--accent-text); border: 0.5px solid var(--border2); white-space: nowrap; }

    .hist-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; margin-top: 16px; }
    .hist-sel {
      flex: 1; background: var(--surface); border: 0.5px solid var(--border2);
      color: var(--text); border-radius: var(--r); padding: 9px 12px;
      font-size: 13px; font-family: var(--sans); outline: none;
    }
    .hist-meta { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .pill {
      font-family: var(--mono); font-size: 11px; padding: 3px 9px;
      border-radius: 4px; letter-spacing: .3px;
    }
    .pill.green { background: var(--green-dim); color: var(--green); }
    .pill.amber { background: var(--accent-dim); color: var(--accent-text); }

    .h-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r2); overflow: hidden; margin-bottom: 6px;
    }
    .h-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-bottom: 0.5px solid var(--border);
    }
    .h-row:last-child { border-bottom: none; }
    .h-id { font-family: var(--mono); font-size: 13px; color: var(--text2); width: 44px; flex-shrink: 0; }
    .h-row.passed .h-id { color: var(--green); }
    .pass-badge {
      display: inline-flex; align-items: center; gap: 3px;
      background: var(--green-dim); color: var(--green);
      font-size: 11px; padding: 2px 8px; border-radius: 3px;
      font-family: var(--mono);
    }
    .fail-dash { color: var(--text3); }
    .h-rem { font-size: 12px; color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty-state { text-align: center; padding: 3rem 0; color: var(--text3); }
    .empty-state i { font-size: 32px; display: block; margin-bottom: 10px; }

    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: var(--green); color: #0d0f14;
      font-size: 13px; font-weight: 500; padding: 9px 20px;
      border-radius: var(--r2); opacity: 0; pointer-events: none;
      transition: opacity .3s; z-index: 99;
    }
    .toast.show { opacity: 1; }

    .section-label {
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
      color: var(--text3); text-transform: uppercase; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }

    .add-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 0.5px dashed var(--border2);
      border-radius: var(--r2); padding: 10px 14px; margin-top: 6px;
    }
    .add-input {
      flex: 1; background: transparent; border: none; outline: none;
      font-family: var(--mono); font-size: 13px; color: var(--text);
      text-transform: uppercase; letter-spacing: .5px;
    }
    .add-input::placeholder { color: var(--text3); text-transform: none; letter-spacing: 0; }
    .add-confirm {
      background: var(--accent-dim); border: 0.5px solid rgba(232,160,32,0.3);
      color: var(--accent-text); border-radius: var(--r);
      padding: 5px 12px; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
    }

    .del-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text3); padding: 4px; margin-left: auto;
    }
    .del-btn:hover { color: #e24b4a; }
    .del-btn i { font-size: 15px; }

    /* 弹窗样式 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.9); z-index: 999;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--surface); border: 0.5px solid var(--border2);
      border-radius: var(--r2); padding: 24px;
      width: 100%; max-width: 400px;
    }
    .modal-box h3 {
      font-family: var(--mono); color: var(--accent-text);
      margin-bottom: 8px; font-size: 16px;
    }
    .modal-box p {
      font-size: 12px; color: var(--text2); margin-bottom: 16px;
    }
    .modal-box input {
      width: 100%; padding: 12px;
      background: var(--surface2); border: 0.5px solid var(--border2);
      border-radius: var(--r); color: var(--text);
      font-family: var(--mono); font-size: 13px;
      margin-bottom: 12px; outline: none;
    }
    .modal-box input:focus { border-color: var(--accent); }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btns button {
      padding: 12px; border: none; border-radius: var(--r);
      font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .modal-btns .btn-confirm {
      flex: 1; background: var(--accent); color: #0d0f14;
    }
    .modal-btns .btn-cancel {
      padding: 12px 20px; background: var(--surface2);
      color: var(--text2); border: 0.5px solid var(--border2);
    }

    /* 时钟样式 */
    #sync-time {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent-text);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="status-bar">
  <span class="dot" id="sync-dot"></span>
  <span id="sync-status" style="font-size:11px;">未连接</span>
  <span style="margin-left:auto;" id="sync-time">--:--:--</span>
</div>

<div class="hdr">
  <div class="hdr-left">
    <span class="eyebrow">死亡搁浅 2 · QC SYSTEM</span>
    <div class="hdr-title">主机质检记录</div>
    <div class="hdr-sub" id="hdr-sub">共 20 台主机</div>
  </div>
  <div class="date-chip" onclick="document.getElementById('dpick').focus()">
    <i class="ti ti-calendar" style="font-size:14px"></i>
    <span id="d-disp">—</span>
    <input type="date" id="dpick" onchange="onDateChange()">
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="s-total">20</div><div class="stat-l">主机总数</div></div>
  <div class="stat"><div class="stat-n hi" id="s-pass">0</div><div class="stat-l">已通过</div></div>
  <div class="stat"><div class="stat-n" id="s-pct">0%</div><div class="stat-l">通过率</div></div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-u" onclick="switchTab('u')">
    <i class="ti ti-pencil"></i>今日更新
  </button>
  <button class="tab" id="tab-h" onclick="switchTab('h')">
    <i class="ti ti-clock-hour-4"></i>历史记录
  </button>
</div>

<div class="panel on" id="panel-u">
  <div class="section-label" style="margin-top:8px">通道状态</div>
  <div class="host-grid" id="host-grid"></div>
  <div class="add-row">
    <i class="ti ti-plus" style="font-size:15px;color:var(--text3);flex-shrink:0"></i>
    <input class="add-input" id="add-input" placeholder="输入主机编号，如 GZ021" maxlength="20"
           onkeydown="if(event.key==='Enter')addHost()">
    <button class="add-confirm" onclick="addHost()">
      <i class="ti ti-check"></i>添加
    </button>
  </div>
</div>

<div class="panel" id="panel-h">
  <div class="hist-top">
    <select class="hist-sel" id="hist-sel" onchange="loadHist()">
      <option value="">— 选择历史日期 —</option>
    </select>
  </div>
  <div id="hist-meta" class="hist-meta" style="display:none"></div>
  <div id="hist-body"><div class="empty-state"><i class="ti ti-archive"></i>选择日期查看历史记录</div></div>
</div>

<div class="save-bar">
  <button class="btn btn-primary" onclick="saveAndSync()">
    <i class="ti ti-cloud-up"></i>保存
  </button>
  <button class="btn btn-secondary" onclick="retrySync()" id="retry-btn" style="display:none;">
    <i class="ti ti-refresh"></i>重试同步
  </button>
  <button class="btn btn-secondary" onclick="showTokenInput()">
    <i class="ti ti-key"></i> 导入Token
  </button>
</div>

<!-- Token输入弹窗 -->
<div class="modal-overlay" id="tokenModal">
  <div class="modal-box">
    <h3>🔑 导入Token</h3>
    <p>粘贴你的GitHub Token（以ghp_开头）<br>Token会保存在浏览器中</p>
    <input id="tokenInput" type="password" placeholder="ghp_xxxxxxxxxxxx">
    <div class="modal-btns">
      <button class="btn-confirm" onclick="saveManualToken()">确认</button>
      <button class="btn-cancel" onclick="hideTokenInput()">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GIST_ID = '7f5932c27738dfa4d93bee403bc32d09';
const API_URL = `https://api.github.com/gists/${GIST_ID}`;
const DEFAULT_HOSTS = Array.from({length:20},(_,i)=>'GZ'+String(i+1).padStart(3,'0'));

let GITHUB_TOKEN = '';
let HOSTS = [...DEFAULT_HOSTS];
let records = {};
let todayStatus = {};
let currentDate = '';
let remarkTimer = null;
let isOnline = true;
let pendingSave = false;
let clockInterval = null; // 时钟定时器

// ==================== 实时时钟 ====================
function updateClock() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
  document.getElementById('sync-time').textContent = timeStr;
}

function startClock() {
  // 先清除旧的定时器，防止重复
  if (clockInterval) clearInterval(clockInterval);
  // 立即更新一次
  updateClock();
  // 每秒更新
  clockInterval = setInterval(updateClock, 1000);
}

// ==================== Token 管理 ====================
function getToken() {
  return localStorage.getItem('ds2_github_token') || '';
}

function saveToken(token) {
  localStorage.setItem('ds2_github_token', token);
  GITHUB_TOKEN = token;
  updateSyncStatus('online');
  hideTokenInput();
  toast('✅ Token已保存！正在同步...');
  initApp();
}

function showTokenInput() {
  document.getElementById('tokenModal').classList.add('show');
  document.getElementById('tokenInput').value = '';
  setTimeout(() => document.getElementById('tokenInput').focus(), 100);
}

function hideTokenInput() {
  document.getElementById('tokenModal').classList.remove('show');
}

function saveManualToken() {
  const input = document.getElementById('tokenInput');
  const token = input.value.trim();

  if (!token) {
    toast('请输入Token');
    return;
  }

  if (!token.startsWith('ghp_')) {
    toast('❌ Token应以ghp_开头');
    return;
  }

  saveToken(token);
}

// ==================== API 操作 ====================
async function fetchFromGist() {
  if (!GITHUB_TOKEN) return false;

  try {
    updateSyncStatus('syncing');
    const response = await fetch(API_URL, {
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    if (!response.ok) throw new Error('获取失败');

    const gist = await response.json();
    const file = gist.files['ds2_qc_data.json'];

    if (file && file.content) {
      const data = JSON.parse(file.content);
      if (data.hosts) HOSTS = data.hosts;
      if (data.records) records = data.records;

      if (records[currentDate] && records[currentDate].hosts) {
        todayStatus = JSON.parse(JSON.stringify(records[currentDate].hosts));
      } else {
        todayStatus = {};
      }
    }

    updateSyncStatus('online');
    return true;
  } catch (error) {
    console.error('加载失败:', error);
    updateSyncStatus('offline');
    return false;
  }
}

async function uploadToGist(data) {
  if (!GITHUB_TOKEN) {
    toast('❌ 请先导入Token');
    return false;
  }

  try {
    updateSyncStatus('syncing');
    const response = await fetch(API_URL, {
      method: 'PATCH',
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        files: {
          'ds2_qc_data.json': {
            content: JSON.stringify(data, null, 2)
          }
        }
      })
    });

    if (!response.ok) throw new Error('上传失败');

    updateSyncStatus('online');
    return true;
  } catch (error) {
    console.error('上传失败:', error);
    return false;
  }
}

function getCurrentData() {
  if (!records[currentDate]) {
    records[currentDate] = { hosts: {}, hostOrder: [] };
  }
  records[currentDate].hosts = JSON.parse(JSON.stringify(todayStatus));
  records[currentDate].hostOrder = [...HOSTS];

  return {
    hosts: HOSTS,
    records: records,
    version: '3.0',
    lastModified: new Date().toISOString()
  };
}

async function immediateSave() {
  if (!GITHUB_TOKEN) return;
  const data = getCurrentData();
  const success = await uploadToGist(data);
  if (success) {
    toast('✅ 已保存');
  } else {
    updateSyncStatus('pending');
    toast('⚠️ 保存失败，数据已暂存');
  }
}

function updateSyncStatus(status) {
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-status');
  const retryBtn = document.getElementById('retry-btn');
  dot.className = 'dot';

  switch(status) {
    case 'online':
      isOnline = true;
      pendingSave = false;
      dot.classList.add('online');
      text.textContent = '云端已连接';
      retryBtn.style.display = 'none';
      break;
    case 'offline':
      isOnline = false;
      dot.classList.add('offline');
      text.textContent = pendingSave ? '离线模式 (有未保存更改)' : '离线模式';
      retryBtn.style.display = pendingSave ? 'block' : 'none';
      break;
    case 'syncing':
      dot.classList.add('online');
      text.textContent = '同步中...';
      retryBtn.style.display = 'none';
      break;
    case 'pending':
      pendingSave = true;
      if (isOnline) {
        dot.classList.add('online');
        text.textContent = '待同步...';
      } else {
        dot.classList.add('offline');
        text.textContent = '离线模式 (有未保存更改)';
      }
      retryBtn.style.display = 'block';
      break;
  }
}

// ==================== UI 函数 ====================
function safeId(h) { return h.replace(/[^a-zA-Z0-9_-]/g,'_'); }

function buildHostGrid() {
  const grid = document.getElementById('host-grid');
  if (!grid) return;

  grid.innerHTML = '';
  HOSTS.forEach(host => {
    const d = todayStatus[host] || {};
    const on = !!d.checked;
    const rem = d.remark || '';
    const sid = safeId(host);

    const card = document.createElement('div');
    card.className = 'host-card' + (on ? ' checked' : '');
    card.id = 'card-' + sid;
    card.innerHTML = `
      <div class="host-top" onclick="toggleHost('${host}','${sid}')">
        <span class="host-id">${host}</span>
        <div class="toggle-track"><div class="toggle-knob"></div></div>
        <span class="toggle-label">${on ? '通道已通过' : '待检测'}</span>
        <i class="ti ${on ? 'ti-check' : 'ti-minus'}" style="font-size:15px;color:${on ? 'var(--green)' : 'var(--text3)'}"></i>
        <button class="del-btn" onclick="deleteHost(event,'${host}')">
          <i class="ti ti-trash"></i>
        </button>
      </div>
      <div class="host-bottom">
        <input class="remark-in" id="rm-${sid}" placeholder="质检备注（选填）" value="${rem.replace(/"/g,'&quot;')}" oninput="updateRemark('${host}','${sid}')">
      </div>`;
    grid.appendChild(card);
  });

  document.getElementById('hdr-sub').textContent = `共 ${HOSTS.length} 台主机`;
}

function updateStats() {
  const total = HOSTS.length;
  const passed = HOSTS.filter(h => todayStatus[h] && todayStatus[h].checked).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-pass').textContent = passed;
  document.getElementById('s-pct').textContent = (total > 0 ? Math.round(passed/total*100) : 0) + '%';
}

async function toggleHost(host, sid) {
  if(!todayStatus[host]) todayStatus[host] = { checked: false, remark: '' };
  todayStatus[host].checked = !todayStatus[host].checked;

  const card = document.getElementById('card-' + sid);
  if (card) {
    const on = todayStatus[host].checked;
    card.classList.toggle('checked', on);
    card.querySelector('.toggle-label').textContent = on ? '通道已通过' : '待检测';
    const ico = card.querySelector('.host-top i.ti');
    ico.className = 'ti ' + (on ? 'ti-check' : 'ti-minus');
    ico.style.color = on ? 'var(--green)' : 'var(--text3)';
  }

  updateStats();
  await immediateSave();
}

async function updateRemark(host, sid) {
  if(!todayStatus[host]) todayStatus[host] = { checked: false, remark: '' };
  todayStatus[host].remark = document.getElementById('rm-'+sid).value;
  
  clearTimeout(remarkTimer);
  
  remarkTimer = setTimeout(async () => {
    await immediateSave();
  }, 3000);
}

async function deleteHost(event, host) {
  event.stopPropagation();
  const idx = HOSTS.indexOf(host);
  if(idx === -1) return;
  HOSTS.splice(idx, 1);
  delete todayStatus[host];
  buildHostGrid();
  updateStats();
  await immediateSave();
}

async function addHost() {
  const inp = document.getElementById('add-input');
  const val = inp.value.trim().toUpperCase();
  if(!val) { inp.focus(); return; }
  if(HOSTS.includes(val)) { toast('已存在'); return; }
  HOSTS.push(val);
  inp.value = '';
  buildHostGrid();
  updateStats();
  await immediateSave();
}

function onDateChange() {
  currentDate = document.getElementById('dpick').value;
  const [y,m,d] = currentDate.split('-');
  document.getElementById('d-disp').textContent = `${m}/${d}`;

  if (records[currentDate] && records[currentDate].hosts) {
    todayStatus = JSON.parse(JSON.stringify(records[currentDate].hosts));
  } else {
    todayStatus = {};
  }
  buildHostGrid();
  updateStats();
}

function updateHistorySelect() {
  const sel = document.getElementById('hist-sel');
  const dates = Object.keys(records).sort((a,b) => b.localeCompare(a));
  sel.innerHTML = '<option value="">— 选择历史日期 —</option>';
  dates.forEach(d => {
    const o = document.createElement('option');
    o.value = d;
    const [y,m,dd] = d.split('-');
    o.textContent = `${y}年${m}月${dd}日`;
    sel.appendChild(o);
  });
}

function loadHist() {
  const d = document.getElementById('hist-sel').value;
  const body = document.getElementById('hist-body');
  const meta = document.getElementById('hist-meta');

  if(!d || !records[d]) {
    body.innerHTML = '<div class="empty-state"><i class="ti ti-archive"></i>选择日期查看历史记录</div>';
    meta.style.display = 'none';
    return;
  }

  const rec = records[d];
  const hostList = rec.hostOrder || Object.keys(rec.hosts);
  const passed = hostList.filter(h => rec.hosts[h] && rec.hosts[h].checked).length;

  meta.style.display = 'flex';
  meta.innerHTML = `<span class="pill amber">死亡搁浅2</span><span class="pill green">通过 ${passed}/${hostList.length}</span>`;

  const card = document.createElement('div');
  card.className = 'h-card';
  card.innerHTML = hostList.map(h => {
    const hd = rec.hosts[h] || {};
    return `<div class="h-row${hd.checked ? ' passed' : ''}">
      <span class="h-id">${h}</span>
      <span>${hd.checked ? '<span class="pass-badge"><i class="ti ti-check"></i> 通过</span>' : '<span class="fail-dash">—</span>'}</span>
      ${hd.remark ? `<span class="h-rem">${hd.remark}</span>` : ''}
    </div>`;
  }).join('');

  body.innerHTML = '';
  body.appendChild(card);
}

function switchTab(t) {
  document.getElementById('tab-u').classList.toggle('active', t==='u');
  document.getElementById('tab-h').classList.toggle('active', t==='h');
  document.getElementById('panel-u').classList.toggle('on', t==='u');
  document.getElementById('panel-h').classList.toggle('on', t==='h');
  if(t==='h') loadHist();
}

async function saveAndSync() {
  if (!currentDate) { toast('请选择日期'); return; }
  if (!GITHUB_TOKEN) { toast('请先导入Token'); return; }

  if (!records[currentDate]) records[currentDate] = { hosts: {}, hostOrder: [] };
  records[currentDate].hosts = JSON.parse(JSON.stringify(todayStatus));
  records[currentDate].hostOrder = [...HOSTS];
  
  const success = await immediateSave();
  if (success) {
    updateHistorySelect();
  }
}

async function retrySync() {
  if (!GITHUB_TOKEN) { toast('请先导入Token'); return; }
  
  toast('正在重试同步...');
  const success = await immediateSave();
  if (success) {
    updateHistorySelect();
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// 暴露函数
window.toggleHost = toggleHost;
window.updateRemark = updateRemark;
window.deleteHost = deleteHost;
window.addHost = addHost;
window.switchTab = switchTab;
window.saveAndSync = saveAndSync;
window.retrySync = retrySync;
window.showTokenInput = showTokenInput;
window.hideTokenInput = hideTokenInput;
window.saveManualToken = saveManualToken;

// ==================== 初始化 ====================
async function initApp() {
  const now = new Date();
  currentDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('dpick').value = currentDate;
  const [y,m,d] = currentDate.split('-');
  document.getElementById('d-disp').textContent = `${m}/${d}`;

  if (GITHUB_TOKEN) {
    const online = await fetchFromGist();
    if (!online) {
      updateSyncStatus('offline');
    }
  }

  buildHostGrid();
  updateStats();
  updateHistorySelect();
}

function init() {
  // 启动实时时钟
  startClock();
  
  GITHUB_TOKEN = getToken();
  if (GITHUB_TOKEN) {
    updateSyncStatus('online');
    initApp();
  } else {
    updateSyncStatus('offline');
    const now = new Date();
    currentDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    document.getElementById('dpick').value = currentDate;
    const [y,m,d] = currentDate.split('-');
    document.getElementById('d-disp').textContent = `${m}/${d}`;
    buildHostGrid();
    updateStats();
    toast('💡 请点击"导入Token"按钮');
  }
}

init();
</script>
</body>
</html>
